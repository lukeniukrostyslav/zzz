function prototypeAction(label){
 const title=label||'Action';
 const modal=document.getElementById('prototypeModal');
 document.getElementById('prototypeTitle').textContent=title;
 document.getElementById('prototypeCopy').textContent='Это дизайн-прототип. Здесь уже предусмотрено место для полноценного действия; бизнес-логика и сохранение данных будут подключены после утверждения дизайна.';
 modal.classList.add('open');modal.setAttribute('aria-hidden','false');
}
function closePrototype(){const m=document.getElementById('prototypeModal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}
