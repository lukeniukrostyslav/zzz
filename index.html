function render(){
 nav();document.getElementById('workspaceLabel').textContent=tx('workspace');document.getElementById('localPrivateLabel').textContent=tr('localPrivate');
 document.getElementById('lang').innerHTML='<option value="en">EN</option><option value="ru">RU</option><option value="es">ES</option><option value="de">DE</option><option value="fr">FR</option>';document.getElementById('lang').value=lang;document.documentElement.lang=lang;
 document.title='Profit Commander — '+tx('overview2');document.getElementById('eyebrow').textContent=tx('overview2');
 const titles={dashboard:'dash',pricing:'pricing',leads:'leads',time:'time',expenses:'expenses',contracts:'contracts',payments:'payments',cashflow:'cashflow',reports:'reports',settings:'settings',clients:'clientsTitle',projects:'projectsTitle',quotes:'quotesTitle',invoices:'invoicesTitle'};
 document.getElementById('title').textContent=((LOCALES[lang]||{})[titles[screen]]||tx(titles[screen]||'overview2'));
 document.getElementById('export').textContent=tr('export');document.getElementById('topAction').textContent=tr('new');
 const pages={dashboard,leads,clients,projects,time,expenses,pricing,quotes,contracts,invoices,payments,cashflow,reports,settings};document.getElementById('screens').innerHTML='<section class="screen active">'+pages[screen]()+'</section>'
}
function go(s){screen=s;render();window.scrollTo(0,0)}
document.getElementById('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('pc-lang',lang);render()};
async function boot(){for(const locale of ['en','ru','es','de','fr']){const res=await fetch('locales/'+locale+'.json');if(!res.ok)throw new Error('Locale '+locale+' failed: '+res.status);LOCALES[locale]=await res.json()}render()}
boot().catch(err=>{document.getElementById('title').textContent='Loading error';document.getElementById('eyebrow').textContent=err.message});
