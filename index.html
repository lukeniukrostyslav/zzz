<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profit Commander — Product Design Preview</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#111827;--muted:#667085;--line:#e7eaf0;--accent:#635bff;--accent2:#8b83ff;--soft:#f0efff;--success:#0f9f6e;--warn:#d97706;--danger:#dc4a5f;--shadow:0 12px 35px rgba(16,24,40,.07);--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:250px;background:#101321;color:#c8ccda;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{display:flex;align-items:center;gap:11px;color:#fff;font-weight:800;font-size:17px;margin:0 10px 30px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#8a7cff,#554cf1);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 8px 20px #5149d455}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#9fa6b8;text-align:left;padding:11px 12px;border-radius:11px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:#202437;color:#fff}.ico{width:19px;text-align:center;font-size:15px}.side-bottom{position:absolute;left:16px;right:16px;bottom:20px;border-top:1px solid #282c3c;padding-top:16px}.mini{display:flex;gap:10px;align-items:center;padding:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#ddd9ff;color:#4f46e5;display:grid;place-items:center;font-weight:800}.main{margin-left:250px;width:calc(100% - 250px);padding:28px 34px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:13px;margin-bottom:5px}.title{font-size:28px;font-weight:800;letter-spacing:-.03em}.actions{display:flex;align-items:center;gap:10px}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:11px;color:#344054;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px #635bff2b}.lang{padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}.screen{display:none}.screen.active{display:block}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.metric{padding:19px}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:26px;font-weight:800;margin:8px 0 4px}.delta{font-size:12px;color:var(--success);font-weight:700}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0}.section-title{font-size:16px;font-weight:800}.muted{color:var(--muted);font-size:13px}.content{padding:20px}.split{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}.chart{height:245px;padding:18px;position:relative;overflow:hidden}.bars{height:175px;display:flex;align-items:end;gap:13px;padding:10px 5px 0}.bar{flex:1;background:linear-gradient(180deg,#857dff,#635bff);border-radius:8px 8px 3px 3px;min-height:18px}.axis{display:flex;justify-content:space-between;color:#98a2b3;font-size:11px;margin-top:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:#98a2b3;font-weight:700}.status{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800}.paid{background:#e8f8f1;color:#087f5b}.due{background:#fff5e5;color:#a65b00}.draft{background:#eef1f6;color:#667085}.over{background:#ffe9ec;color:#b4233c}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}.empty{padding:50px 25px;text-align:center}.empty-icon{width:52px;height:52px;border-radius:16px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 13px;font-size:22px}.empty h3{margin:0 0 7px;font-size:16px}.empty p{margin:0 auto 18px;max-width:400px;color:var(--muted);font-size:13px;line-height:1.6}.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:15px}.search{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;min-width:240px;outline:none}.tabs{display:flex;gap:4px;background:#eef0f5;padding:4px;border-radius:12px}.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:9px;color:#667085}.tabs button.active{background:#fff;color:#111827;box-shadow:0 1px 4px #0000000d}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);padding:11px 12px;border-radius:10px;background:#fff;outline:none}.field.full{grid-column:1/-1}.quote{padding:25px}.price{font-size:42px;font-weight:900;letter-spacing:-.04em}.calc{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.range{width:100%;accent-color:var(--accent)}.result{background:#111321;color:#fff;border-radius:18px;padding:24px}.result .small{color:#aab0c0;font-size:12px}.result .big{font-size:40px;font-weight:900;margin:8px 0 20px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2d3140;font-size:13px}.row:last-child{border:0}.profit{color:#72e6b9;font-weight:800}.settings{display:grid;grid-template-columns:220px 1fr;min-height:520px}.settings-nav{padding:15px;border-right:1px solid var(--line)}.settings-nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:9px}.settings-nav button.active{background:var(--soft);color:var(--accent);font-weight:800}.settings-main{padding:28px}.toggle{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}.switch{width:42px;height:24px;background:var(--accent);border-radius:99px;padding:3px}.switch i{display:block;width:18px;height:18px;background:#fff;border-radius:50%;margin-left:18px}.mobile{display:none}.mobile-nav{display:none}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.split,.calc{grid-template-columns:1fr}.side{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}}
@media(max-width:720px){.side{display:none}.main{margin:0;width:100%;padding:18px}.mobile{display:block}.top{align-items:flex-start}.title{font-size:23px}.actions .btn{display:none}.grid4{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.settings{grid-template-columns:1fr}.settings-nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);gap:5px}.settings-nav button{white-space:nowrap}.table{min-width:650px}.card:has(.table){overflow:auto}.search{min-width:150px;width:100%}.toolbar{align-items:stretch;flex-direction:column}.tabs{overflow:auto}.mobile-nav{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:10;background:#101321;border:1px solid #2a2e40;border-radius:18px;padding:7px;justify-content:space-around;box-shadow:0 14px 35px #0003}.mobile-nav button{border:0;background:transparent;color:#9fa6b8;border-radius:12px;padding:8px 10px;font-size:11px;display:grid;gap:3px;justify-items:center}.mobile-nav button.active{background:#202437;color:#fff}.mobile-nav .m-ico{font-size:16px}.main{padding-bottom:105px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><span class="logo">P</span><span>Profit Commander</span></div>
<nav class="nav" id="nav"></nav>
<div class="side-bottom"><div class="mini"><span class="avatar">R</span><div><b id="workspaceLabel" style="color:#fff;font-size:13px"></b><div id="localPrivateLabel" style="font-size:11px"></div></div></div></div>
</aside>
<main class="main">
<div class="top"><div><div class="eyebrow" id="eyebrow"></div><div class="title" id="title"></div></div><div class="actions"><select class="lang" id="lang"></select><button class="btn" id="export"></button><button class="btn primary" id="topAction"></button></div></div>
<div id="screens"></div>
</main>
<nav class="mobile-nav" id="mobileNav"></nav>
</div>
<script>
let LOCALES={};
let lang=localStorage.getItem('pc-lang')||'en', screen='dashboard';localStorage.getItem('pc-lang')||'en', screen='dashboard';
const navKeys=['dash','pricing','clients','projects','quotes','invoices','cashflow','reports','settings'];
const icons=['⌂','◈','♙','▣','◇','▤','↗','▥','⚙'];
function tr(k){return (LOCALES[lang]&&LOCALES[lang][k])||(LOCALES.en&&LOCALES.en[k])||k}
function nav(){const items=navKeys.map((k,i)=>'<button class="'+(screen===(k==='dash'?'dashboard':k)?'active':'')+'" onclick="go(\''+(k==='dash'?'dashboard':k)+'\')"><span class="ico">'+icons[i]+'</span>'+tr(k)+'</button>').join('');document.getElementById('nav').innerHTML=items;document.getElementById('mobileNav').innerHTML=navKeys.slice(0,5).map((k,i)=>'<button class="'+(screen===(k==='dash'?'dashboard':k)?'active':'')+'" onclick="go(\''+(k==='dash'?'dashboard':k)+'\')"><span class="m-ico">'+icons[i]+'</span>'+tr(k)+'</button>').join('')}
function metric(label,value,delta='') {return '<div class="card metric"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="delta">'+delta+'</div></div>'}
function commonEmpty(title,sub){return '<div class="card empty"><div class="empty-icon">+</div><h3>'+title+'</h3><p>'+sub+'</p><button class="btn primary">'+tr('start')+'</button></div>'}
function dashboard(){return '<div class="grid4">'+metric(tr('revenue'),'€0','')+metric(tr('expenses'),'€0','')+metric(tr('profit'),'€0','')+metric(tr('outstanding'),'€0','')+'</div><div class="grid4 section">'+metric(tr('pipeline'),'€0','')+metric(tr('margin'),'0%','')+metric(tr('effective'),'€0','')+metric(tr('monthly'),'€0','')+'</div><div class="split section"><div class="card"><div class="section-head"><div><div class="section-title">'+tr('income')+'</div><div class="muted">'+tr('today')+'</div></div></div><div class="chart"><div class="bars">'+[38,55,44,72,60,83,48,66,57,78,52,88].map(h=>'<i class="bar" style="height:'+h+'%"></i>').join('')+'</div><div class="axis"><span>'+tr('jan')+'</span><span>'+tr('mar')+'</span><span>'+tr('may')+'</span><span>'+tr('jul')+'</span><span>'+tr('sep')+'</span><span>'+tr('nov')+'</span></div></div></div>'+commonEmpty(tr('noData'),tr('empty'))+'</div>'}
function pricing(){return '<div class="calc"><div class="card quote"><div class="section-title">'+tr('pricingTitle')+'</div><p class="muted" style="line-height:1.6">'+tr('pricingSub')+'</p><div class="formgrid" style="margin-top:22px"><div class="field"><label>'+tr('target')+'</label><input value="6000"></div><div class="field"><label>'+tr('hours')+'</label><input value="90"></div><div class="field"><label>'+tr('costs')+'</label><input value="1200"></div><div class="field"><label>'+tr('marginTarget')+'</label><input value="25%"></div></div><div style="margin-top:22px"><label class="muted">'+tr('hours')+'</label><input class="range" type="range" value="60"></div></div><div class="result"><div class="small">'+tr('suggested')+'</div><div class="big">€78<span style="font-size:18px;color:#aab0c0">/h</span></div><div class="row"><span>'+tr('monthly')+'</span><b>€6,000</b></div><div class="row"><span>'+tr('costs')+'</span><span>€1,200</span></div><div class="row"><span>'+tr('marginTarget')+'</span><span>25%</span></div><div class="row"><span>'+tr('project')+' · 40h</span><b>€3,120</b></div><div style="margin-top:22px"><button class="btn" style="width:100%">'+tr('export')+'</button></div></div></div>'}
function listPage(kind,title,sub){return '<div class="toolbar"><div class="tabs"><button class="active">'+tr('all')+'</button><button>'+tr('active')+'</button><button>'+tr('archived')+'</button></div><div style="display:flex;gap:8px"><input class="search" placeholder="'+tr('search')+'"><button class="btn primary">'+tr('new')+'</button></div></div><div class="card">'+commonEmpty(title,sub)+'</div>'}
function clients(){return '<div class="grid4">'+metric(tr('clientsTitle'),'0')+metric(tr('active'), '0')+metric(tr('outstanding'),'€0')+metric(tr('projectsTitle'),'0')+'</div><div class="card section"><div class="section-head"><div><div class="section-title">'+tr('clientsTitle')+'</div><div class="muted">'+tr('clientsSub')+'</div></div><button class="btn primary">'+tr('new')+'</button></div>'+commonEmpty(tr('noData'),tr('empty'))+'</div>'}
function projects(){return '<div class="grid4">'+metric(tr('projectsTitle'),'0')+metric(tr('pipeline'),'€0')+metric(tr('profit'),'€0')+metric(tr('margin'),'0%')+'</div><div class="card section"><div class="section-head"><div><div class="section-title">'+tr('projectsTitle')+'</div><div class="muted">'+tr('projectsSub')+'</div></div><button class="btn primary">'+tr('new')+'</button></div><table class="table"><thead><tr><th>'+tr('projectName')+'</th><th>'+tr('client')+'</th><th>'+tr('amount')+'</th><th>'+tr('margin')+'</th><th>'+tr('status')+'</th></tr></thead><tbody><tr><td colspan="5"><div class="empty" style="padding:38px 20px"><div class="empty-icon">+</div><h3>'+tr('noData')+'</h3><p>'+tr('empty')+'</p></div></td></tr></tbody></table></div>'}
function quotes(){return '<div class="grid4">'+metric(tr('quotesTitle'),'0')+metric(tr('active'),'0')+metric(tr('outstanding'),'€0')+metric(tr('margin'),'0%')+'</div><div class="card section"><div class="section-head"><div><div class="section-title">'+tr('quotesTitle')+'</div><div class="muted">'+tr('quotesSub')+'</div></div><button class="btn primary">'+tr('new')+'</button></div><table class="table"><thead><tr><th>'+tr('projectName')+'</th><th>'+tr('client')+'</th><th>'+tr('amount')+'</th><th>'+tr('status')+'</th><th>'+tr('actions')+'</th></tr></thead><tbody><tr><td colspan="5"><div class="empty" style="padding:38px 20px"><div class="empty-icon">◇</div><h3>'+tr('noData')+'</h3><p>'+tr('empty')+'</p></div></td></tr></tbody></table></div>'}
function reports(){return '<div class="split"><div class="card"><div class="section-head"><div><div class="section-title">'+tr('reportsTitle')+'</div><div class="muted">'+tr('reportsSub')+'</div></div></div><div class="content"><div class="grid4" style="grid-template-columns:repeat(2,1fr)">'+metric(tr('revenue'),'€0')+metric(tr('expenses'),'€0')+metric(tr('profit'),'€0')+metric(tr('margin'),'0%')+'</div></div></div><div class="card empty"><div class="empty-icon">▥</div><h3>'+tr('noData')+'</h3><p>'+tr('empty')+'</p><button class="btn primary">'+tr('export')+'</button></div></div>'}
function invoices(){return '<div class="toolbar"><div class="tabs"><button class="active">'+tr('status')+'</button><button>'+tr('paid')+'</button><button>'+tr('overdue')+'</button></div><button class="btn primary">'+tr('new')+' '+tr('invoices')+'</button></div><div class="card"><table class="table"><thead><tr><th>'+tr('invoice')+'</th><th>'+tr('client')+'</th><th>'+tr('amount')+'</th><th>'+tr('due')+'</th><th>'+tr('status')+'</th></tr></thead><tbody><tr><td>—</td><td>—</td><td>€0</td><td>—</td><td><span class="status draft">'+tr('draft')+'</span></td></tr></tbody></table>'+commonEmpty(tr('noData'),tr('empty'))+'</div>'}
function cash(){return '<div class="grid4">'+metric(tr('income'),'€0')+metric(tr('expenses'),'€0')+metric(tr('profit'),'€0')+metric(tr('runway'),'—')+'</div><div class="card section chart"><div class="section-title">'+tr('cashTitle')+'</div><div class="bars">'+[18,24,16,35,28,40,22,33,27,46,31,51].map(h=>'<i class="bar" style="height:'+h+'%"></i>').join('')+'</div><div class="axis"><span>'+tr('jan')+'</span><span>'+tr('mar')+'</span><span>'+tr('may')+'</span><span>'+tr('jul')+'</span><span>'+tr('sep')+'</span><span>'+tr('nov')+'</span></div></div>'}
function settings(){return '<div class="card settings"><div class="settings-nav"><button class="active">'+tr('settingsTitle')+'</button><button>'+tr('language')+'</button><button>'+tr('data')+'</button></div><div class="settings-main"><div class="section-title">'+tr('settingsTitle')+'</div><p class="muted">'+tr('settingsSub')+'</p><div class="toggle"><div><b>'+tr('privacy')+'</b><div class="muted">'+tr('local')+'</div></div><span class="switch"><i></i></span></div><div class="toggle"><div><b>'+tr('offline')+'</b><div class="muted">'+tr('backup')+'</div></div><span class="switch"><i></i></span></div><div style="margin-top:20px" class="field"><label>'+tr('currency')+'</label><select><option>'+tr('currencyEur')+'</option><option>'+tr('currencyUsd')+'</option><option>'+tr('currencyGbp')+'</option></select></div><button class="btn primary" style="margin-top:20px">'+tr('save')+'</button></div></div>'}
function render(){nav();document.getElementById('workspaceLabel').textContent=tr('workspace');document.getElementById('localPrivateLabel').textContent=tr('localPrivate');document.getElementById('lang').innerHTML='<option value="en">EN</option><option value="ru">RU</option><option value="es">ES</option><option value="de">DE</option><option value="fr">FR</option>';document.getElementById('lang').value=lang;document.documentElement.lang=lang;document.title='Profit Commander — '+tr('dash');document.getElementById('eyebrow').textContent=tr('overview');document.getElementById('title').textContent=screen==='dashboard'?tr('dash'):tr(screen==='pricing'?'pricing':screen+'Title');document.getElementById('export').textContent=tr('export');document.getElementById('topAction').textContent=tr('new');let body=screen==='dashboard'?dashboard():screen==='pricing'?pricing():screen==='invoices'?invoices():screen==='cashflow'?cash():screen==='settings'?settings():screen==='clients'?clients():screen==='projects'?projects():screen==='quotes'?quotes():reports();document.getElementById('screens').innerHTML='<section class="screen active">'+body+'</section>'}
function go(s){screen=s;render();window.scrollTo(0,0)}
document.getElementById('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('pc-lang',lang);render()};
async function boot(){for(const locale of ['en','ru','es','de','fr']){const res=await fetch('locales/'+locale+'.json');if(!res.ok)throw new Error('Locale '+locale+' failed: '+res.status);LOCALES[locale]=await res.json()}render()}
boot().catch(err=>{document.getElementById('title').textContent='Loading error';document.getElementById('eyebrow').textContent=err.message});
</script>
</body></html>
